version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: parking_postgres
    environment:
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: smart_parking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: parking_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
